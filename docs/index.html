<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juturi Lakshmi Anantha Sankar – Resume</title>
<style>
:root{--bg:#fff;--fg:#111;--card:#f4f5f7;--mut:#667;--acc:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--fg:#eee;--card:#1c1f27;--mut:#9aa}}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:720px;margin:0 auto;padding:40px 20px}
h1{margin:0 0 4px;font-size:1.6rem}.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:24px 0}
.card{background:var(--card);border-radius:12px;padding:16px}
.card h2{margin:0 0 8px;font-size:1rem}.big{font-size:2rem;font-weight:700}
.btn{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:600}
a{color:var(--acc)}
</style></head><body><main>
<h1>Juturi Lakshmi Anantha Sankar</h1>
<div class="mut">Aspiring Web Developer · B.Tech CSE, SRKR Engineering College</div>
<div class="grid" id="g"><div class="card mut">Loading stats…</div></div>
<a class="btn" href="Sankar_Resume.pdf" download>Download Resume (PDF)</a>
<p class="mut" id="u"></p>
<p><a href="https://github.com/SANKARJUTURI">GitHub</a> ·
<a href="https://www.linkedin.com/in/juturi-lakshmi-anantha-sankar-42046b337/">LinkedIn</a></p>
<script>
fetch("stats.json?"+Date.now()).then(r=>r.json()).then(s=>{
const l=s.leetcode,g=s.gfg,mh=x=>x.medium+x.hard;
const c=(t,n,rows,u)=>`<div class="card"><h2><a href="${u}">${t}</a></h2><div class="big">${n}</div><div class="mut">problems solved</div><p class="mut">${rows}</p></div>`;
document.getElementById("g").innerHTML=
c("LeetCode",l.solved,`Easy ${l.easy} · Medium ${l.medium} · Hard ${l.hard}`,"https://leetcode.com/u/SANKAR_JUTURI/")+
c("GeeksforGeeks",g.solved,`Easy ${g.easy} · Medium ${g.medium} · Hard ${g.hard}`,"https://www.geeksforgeeks.org/profile/juturisankar")+
c("Combined",l.solved+g.solved,`${mh(l)+mh(g)} Medium/Hard`,"#");
document.getElementById("u").textContent="Stats updated automatically every day · last update "+s.updated;
}).catch(()=>{document.getElementById("g").textContent="Stats unavailable."});
</script></main></body></html>
